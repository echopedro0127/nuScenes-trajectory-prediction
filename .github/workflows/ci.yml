name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python and uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install project and CPU PyTorch
        shell: pwsh
        run: |
          $env:UV_CACHE_DIR = "$env:GITHUB_WORKSPACE\.uv-cache"
          uv venv --python 3.12
          uv pip install --python .venv\Scripts\python.exe -e ".[dev]" --index-url https://pypi.org/simple
          uv pip install --python .venv\Scripts\python.exe torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run tests
        shell: pwsh
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Run Ruff
        shell: pwsh
        run: .\.venv\Scripts\ruff.exe check src scripts tests
      - name: Check public repository hygiene
        shell: pwsh
        run: .\.venv\Scripts\python.exe scripts\check_public_repo.py
